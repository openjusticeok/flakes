name: Update flake.lock

on:
  schedule:
    # Thursdays at 10:00 UTC
    - cron: '0 10 * * 4'
  workflow_dispatch:

jobs:
  update-lock:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/flake-lock
          delete-branch: true
          title: 'chore: update flake.lock'
          body: |
            Updates all flake inputs (`nixpkgs`, `flake-parts`, etc.).

            > **Note:** PRs opened by `GITHUB_TOKEN` do not trigger CI automatically. Close and reopen this PR to run `flake-checks.yml`.
          commit-message: 'chore: update flake.lock'
